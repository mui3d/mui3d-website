<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090b">
  <title>Update Password | Mui3D</title>
  <link rel="stylesheet" href="../css/hidden-product.css">
</head>
<body class="auth-page">
  <header class="private-nav">
    <a class="private-nav__brand" href="../index.html" aria-label="Mui3D home">Mui3D</a>
    <a class="private-nav__back" href="diabolo.html">Back to Diabolo</a>
  </header>

  <main class="auth-page__main">
    <section class="auth-page__panel" aria-labelledby="update-password-title">
      <p class="auth-dialog__kicker">Mui3D Account</p>
      <h1 id="update-password-title">Choose a new password</h1>
      <form id="update-password-form" class="auth-form" novalidate>
        <label class="auth-field">
          <span>New password</span>
          <input id="new-password" type="password" autocomplete="new-password" required minlength="8">
        </label>
        <label class="auth-field">
          <span>Confirm new password</span>
          <input id="confirm-new-password" type="password" autocomplete="new-password" required minlength="8">
        </label>
        <p id="update-password-feedback" class="auth-feedback" role="status" aria-live="polite"></p>
        <button id="update-password-submit" class="auth-submit" type="submit">Update Password</button>
      </form>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script type="module" src="../js/auth-update-password.js"></script>
</body>
</html>
